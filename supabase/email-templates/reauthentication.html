<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your Countiva verification code</title>
  </head>
  <body
    style="
      margin: 0;
      background: #f1f0ec;
      font-family: Arial, Helvetica, sans-serif;
      color: #252525;
    "
  >
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center" style="padding: 28px 12px">
          <table
            role="presentation"
            width="560"
            cellpadding="0"
            cellspacing="0"
            style="
              width: 100%;
              max-width: 560px;
              background: #faf9f6;
              border: 1px solid #d9d8d2;
              border-radius: 18px;
            "
          >
            <tr>
              <td style="padding: 28px">
                <a
                  href="https://countiva.shop"
                  style="
                    text-decoration: none;
                    color: #252525;
                    font-size: 25px;
                    font-weight: 600;
                  "
                  ><img
                    src="https://countiva.shop/brand/countiva-192.png?v=4"
                    alt=""
                    width="36"
                    height="36"
                    style="vertical-align: middle; margin-right: 8px; border: 0"
                  />Countiva</a
                >
                <h1
                  style="font-size: 25px; line-height: 1.3; margin: 28px 0 16px"
                >
                  Verify it’s you
                </h1>
                <p style="font-size: 16px; line-height: 1.7">Hello,</p>
                <p
                  style="font-size: 16px; line-height: 1.7; margin-bottom: 24px"
                >
                  Enter this code in Countiva to confirm the sensitive account
                  change you requested.
                </p>
                <p
                  style="
                    font-size: 30px;
                    letter-spacing: 6px;
                    font-weight: 600;
                    color: #252525;
                  "
                >
                  {{ .Token }}
                </p>
                <p
                  style="
                    font-size: 14px;
                    line-height: 1.7;
                    color: #62625d;
                    margin: 26px 0;
                  "
                >
                  If you didn’t request this code, you can ignore this email.
                  Keep the code private.
                </p>
                <p style="font-size: 14px; line-height: 1.7">
                  The Countiva team
                </p>
                <hr
                  style="
                    border: 0;
                    border-top: 1px solid #d9d8d2;
                    margin: 24px 0;
                  "
                />
                <a
                  href="https://countiva.shop"
                  style="color: #62625d; font-size: 13px"
                  >countiva.shop</a
                >
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
